<notifier-container></notifier-container>
<div class="container p-4 " [ngClass]="{'bg-white': !editMode}">
    <h2 class="mb-4">Vendor Bank Details</h2>

    <form [formGroup]="vendorForm" (ngSubmit)="submitForm()">
        <div class="row mb-2">

            <div class="col-md-6">
                <label>Name</label>
                <input type="text" class="form-control" formControlName="name" [readonly]="editMode" />
            </div>
            <div class="col-md-6">
                <label>Email</label>
                <input type="email" class="form-control" formControlName="email" [readonly]="editMode" />
            </div>
        </div>

        <div class="row mb-2">

            <div class="col-md-6">
                <label>Phone</label>
                <input type="text" class="form-control" formControlName="phone" [readonly]="editMode" />
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-md-6">
                <label>Bank Account</label>
                <input type="number" class="form-control" formControlName="bank_account" [readonly]="editMode" />
            </div>
            <div class="col-md-6">
                <label>IFSC</label>
                <input type="text" class="form-control" formControlName="ifsc" [readonly]="editMode"
                    style="text-transform: uppercase" (input)="onIfscInput($event)" />

            </div>

        </div>

        <div class="row mb-2">
            <div class="col-md-3">
                <label>Commission %</label>
                <input type="number" class="form-control" formControlName="commission_percentage" [readonly]="true" />
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-success" *ngIf="!editMode">Add Vendor</button>
            <button type="button" class="btn btn-primary" *ngIf="editMode" (click)="enableEdit()">Edit</button>
        </div>
    </form>
    <!-- </div>Update BankDetails -->
